name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm ci
        working-directory: dev
      - run: npm test
        working-directory: dev
      - run: npm run build
        working-directory: dev
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dev/dist/scratch-tensor-extension.js \
            --generate-notes
